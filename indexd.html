<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Illustration</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SVG Illustration</h1>
        <svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ffdbac;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f4c49a;stop-opacity:1" />
                </linearGradient>
                <filter id="shadow">
                    <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                </filter>
            </defs>
            
            <!-- Arm illustration -->
            <g id="arm" filter="url(#shadow)">
                <!-- Upper arm -->
                <ellipse cx="200" cy="150" rx="40" ry="80" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="2"/>
                
                <!-- Elbow joint -->
                <circle cx="200" cy="220" r="30" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="2"/>
                
                <!-- Forearm -->
                <ellipse cx="200" cy="290" rx="35" ry="70" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="2"/>
                
                <!-- Hand -->
                <ellipse cx="200" cy="360" rx="45" ry="30" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="2"/>
                
                <!-- Fingers -->
                <g id="fingers">
                    <!-- Thumb -->
                    <ellipse cx="160" cy="365" rx="12" ry="20" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="1.5" transform="rotate(-30 160 365)"/>
                    
                    <!-- Index finger -->
                    <rect x="185" y="375" width="10" height="25" rx="5" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="1.5"/>
                    
                    <!-- Middle finger -->
                    <rect x="200" y="375" width="10" height="28" rx="5" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="1.5"/>
                    
                    <!-- Ring finger -->
                    <rect x="215" y="375" width="10" height="25" rx="5" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="1.5"/>
                    
                    <!-- Pinky finger -->
                    <rect x="230" y="375" width="8" height="20" rx="4" fill="url(#skinGradient)" stroke="#d4a574" stroke-width="1.5"/>
                </g>
                
                <!-- Muscle definition lines -->
                <path d="M 180 140 Q 190 150 180 160" stroke="#d4a574" stroke-width="1.5" fill="none" opacity="0.5"/>
                <path d="M 220 140 Q 210 150 220 160" stroke="#d4a574" stroke-width="1.5" fill="none" opacity="0.5"/>
                <path d="M 180 270 Q 190 280 180 290" stroke="#d4a574" stroke-width="1.5" fill="none" opacity="0.5"/>
                <path d="M 220 270 Q 210 280 220 290" stroke="#d4a574" stroke-width="1.5" fill="none" opacity="0.5"/>
            </g>
            
            <!-- Decorative elements -->
            <text x="200" y="50" font-family="Arial, sans-serif" font-size="24" fill="#667eea" text-anchor="middle" font-weight="bold">Human Arm</text>
        </svg>
    </div>
</body>
</html>
